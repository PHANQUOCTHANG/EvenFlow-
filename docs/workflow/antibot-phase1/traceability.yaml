mutation_targets:
  # engine (G)
  - rules R1 client: `cv < R1_CLIENT_CV` -> `<=`; min samples 8 -> 7
  - rules R1 server: ignore R1_SERVER_MIN; evaluate when !Known
  - rules R2: `rt < R2_MS` -> `<=`
  - rules R3: fire when only one count is 0; not fire for missing payload
  - rules R4D: `> R4D_MAX` -> `>=`; evaluate without fp
  - rules R4N: ignore NetSuppressed; `> R4N_MAX` -> `>=`
  - rules R5: drop lower-casing of UA; empty UA not strong; missing treated as block-eligible
  - rules R5W: weak count `>= 2` -> `>= 1`; drop mobile fc exemption; invalid zone counted as disagreement
  - rules R6: fire on CardIdentities -1
  - rules R7: drop sn/sb floors; `>= R7_MIN_IDS` -> `>`
  - score: remove 3-decimal rounding / tier computed from unrounded score; `>=` -> `>` at cut-offs
  - D11 cap removed (missing-only reaches BLOCK) / CAPPED tag missing
  - D12 REJOIN removed (slot holder demoted or applied BLOCK on non-eligible)
  - sticky: evaluates rules / score != 1
  - shadow: Applied = tier; MODE_SHADOW missing
  - fallback: ANTIBOT_CHALLENGE_FALLBACK ignored
  - decoder: wrong-typed field invalidates whole payload; no rounding; {"v":1} treated as missing; 4096 bytes rejected
  - config: error message without variable name; partial lists replace instead of merge; off validates
  - guard: no context timeout around Observe; breaker never opens / never closes; recover() removed; invalid metric not incremented; BodyErr ignored; sink offered every PASS
  - privacy: FPHash length / key unused; NetPrefix /16 or full address
  # Redis (G/redisstate + W scripts)
  - observe.lua: jt pushed for slot holders; ZSET cap not applied; window from server TIME; share from distinct identities instead of nj counters
  - join.lua: flag check skipped on lane path / applied on 4-arg path; slow post-T0 score missing P or m; idempotency ignores lobby_slow
  - shuffle.lua: early return when main lobby empty (P-5); slow lobby counted in lottery_size; lobby_slow not deleted
  - status.lua: lobby_slow not reported as LOBBY
  - revoke.lua: lobby_slow / admitted not removed; flag not set or TTL != 24 h
  # handler / writer (W)
  - handler: BLOCK without Revoke; 403 body leaks rule ids; SLOW_LANE uses normal lane; BLOCKED state returns 200; UA not truncated; XFF last element used; oversize body rejected
  - writer: PASS stored as 'PASS'; Applied stored instead of tier; non-UUID not NULL; Offer blocks when buffer full; Close does not flush
  # web
  - collector: listeners not passive; pointermove intervals in iv; every scroll discrete; sq without entropy floor; key value stored; snapshot after jitter
  - waiting room: readSignals {} sent instead of {"v":1}; snapshot cleared on 401 re-join; not cleared on sold-out
