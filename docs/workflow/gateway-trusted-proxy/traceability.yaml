    killed_by: [proxy_test.TestTrustedProxy_AC9_UpstreamGetsResolvedIPOnly, proxy_test.TestTrustedProxy_AC3_ClientsBehindTrustedProxyHaveOwnBucket]
  - id: M7
    change: remove the 16-hop cap
    killed_by: [clientip.TestResolve/AC7_17_trusted_hops, proxy_test.TestTrustedProxy_AC9_UpstreamGetsResolvedIPOnly/AC7_17_trusted_hops]
