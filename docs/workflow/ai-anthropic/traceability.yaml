# AC -> tests (services/ai-worker) or gate check. Test counts include parametrised cases.
task: ai-anthropic
base_commit: 169035e
test_root: services/ai-worker/tests

# Interface the frozen tests impose (plan/implementation must match these names exactly).
test_imposed_interface:
  modules: [app.llm.client, app.llm.guarded, app.llm.limiter, app.llm.embedder, app.llm.wiring]
  app.llm.client:
    names: [LlmClient, Generation, RateLimited, LlmIncomplete, mock_embedding, wrap_untrusted]
    LlmClient: >-
      LlmClient(api_key=None (first positional), *, mock=None, sdk=None, chat_model, moderation_model,
      timeout_seconds, thinking_headroom_tokens, gemini_api_key, embed_model, embed_sdk).
      LlmClient() with no args must work in mock mode (reads AI_MOCK, alias GEMINI_MOCK; AI_MOCK wins).
      Env AI_MOCK=0 without key: LlmClient() raises RuntimeError or ValueError whose message contains ANTHROPIC_API_KEY.
    methods:
      - "await build_prompt(job, tools) -> opaque prompt, passed unchanged to generate / guarded_generate"
      - "await generate(prompt, *, max_output_tokens) -> Generation; sends max_tokens = sent_max_tokens(max_output_tokens)"
      - "sent_max_tokens(budget) -> budget + thinking_headroom_tokens"
      - "await scan_moderation(job, *, generate=None) -> ModerationResult; generate may be functools.partial(guarded_generate, limiter, client); moderation model must be used on both paths"
      - "await embed(text) -> list[float] (mock: mock_embedding; real: embed_sdk.aio.models.embed_content(model=embed_model, contents=text) under timeout_seconds)"
    LlmIncomplete: "exception with attribute .reason in {refusal, max_tokens, empty}"
    sdk_shape: "sdk.messages.create(**kwargs) async; resp.content = blocks with .type/.text; resp.usage.input_tokens/.output_tokens; resp.stop_reason"
    messages_create_kwargs: "model, max_tokens, system (str or text blocks), messages=[one user turn], output_config={'effort': 'low'}; every kwarg must exist in anthropic AsyncMessages.create signature"
    lazy_sdk: "anthropic.AsyncAnthropic(api_key=, timeout=, max_retries=0) built once on first generate when sdk=None (patched on anthropic module and on app.llm.client.AsyncAnthropic if present)"
  app.llm.guarded: "guarded_generate(limiter, client, prompt, *, max_output_tokens) signature unchanged; permit = estimate_tokens(prompt text, client.sent_max_tokens(max_output_tokens))"
  app.llm.limiter: [estimate_tokens, Permit]
  app.llm.wiring:
    - "build_llm(settings) -> (llm, embedder); embedder is None when real mode and GEMINI_API_KEY empty; mock -> embedder not None; no SDK client constructed at build time in mock / no-Gemini-key mode"
    - "log_startup(settings, embedder, deprecated=[old env names used]) -> 'semantic cache L3 disabled (GEMINI_API_KEY empty)' logged exactly once (INFO or WARNING) when embedder is None; ready log text contains ai_mock, anthropic, both model ids, semantic_l3; exactly one WARNING per deprecated name, naming the new variable; no key text"
  app.config.Settings:
    fields: [ai_mock, anthropic_api_key (SecretStr), anthropic_model_chat, anthropic_model_moderation, ai_timeout_seconds, ai_rpm, ai_tpm, ai_thinking_headroom_tokens, gemini_api_key (SecretStr), gemini_embed_model]
    construction: "tests set env vars and call Settings(_env_file=None); mock off + no key -> pydantic ValidationError matching ANTHROPIC_API_KEY"
  app.pipeline.semantic_cache: "SemanticCache(redis, None) = L3 disabled: L1 exact hash only, no embed call, no log line"
  consumers: "ChatConsumer(limiter, cache, faq, flight, llm, tools, signals, publish) passed positionally; ModerationConsumer(llm, api_base, callback_fn=..., limiter=...)"
  moderation_incomplete_reason: "AI không đưa ra kết luận, chuyển người duyệt"
  metrics: ["ai_llm_429_total", "ai_llm_incomplete_total{reason}"]

