name: CI

# Cong chat luong chinh: lint -> unit test -> build (EVF-6).
# Integration test, oversell gate va Trivy scan nam o workflow rieng
# (integration.yml, oversell-gate.yml, trivy.yml) vi chay lau hon va can
# dieu kien khac (Docker, chi bat buoc tren nhanh main).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'libs/go/**'
              - 'services/gateway/**'
              - 'services/identity/**'
              - 'services/event/**'
              - 'services/waitingroom/**'
              - 'services/ticketing/**'
              - 'services/payment/**'
              - 'services/antibot/**'
              - 'services/notification/**'
              - 'go.work'
            web:
              - 'apps/web/**'
            python:
              - 'services/ai-worker/**'

  lint-go:
    name: lint-go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.mod'
      - name: go vet moi module
        run: |
          set -e
          for m in libs/go services/gateway services/identity services/event \
                   services/waitingroom services/ticketing services/payment \
                   services/antibot services/notification; do
            echo "== go vet $m =="
            (cd "$m" && go vet ./...)
          done
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: libs/go
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: services/ticketing
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: services/waitingroom

  lint-web:
    name: lint-web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  lint-python:
    name: lint-python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .

  test-go:
    name: test-go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.mod'
      - name: unit test moi module (khong can ha tang)
        run: |
          set -e
          for m in libs/go services/gateway services/identity services/event \
                   services/waitingroom services/ticketing services/payment \
                   services/antibot services/notification; do
            echo "== go test $m =="
            (cd "$m" && go test ./... -race -count=1)
          done
      - name: cong chat luong coverage domain/app >= 70%
        run: |
          set -e
          chmod +x .github/scripts/check-domain-coverage.sh
          for m in libs/go services/gateway services/identity services/event \
                   services/waitingroom services/ticketing services/payment \
                   services/antibot services/notification; do
            ./.github/scripts/check-domain-coverage.sh "$m" 70
          done

  test-web:
    name: test-web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: unit test + coverage (nguong trong vitest.config.ts)
        run: npm run test:coverage

  test-python:
    name: test-python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: pytest (exit 5 = chua co test nao, khong tinh la loi)
        run: |
          set +e
          uv run pytest -q
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

  build:
    name: build
    needs: [changes, lint-go, lint-web, lint-python, test-go, test-web, test-python]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.mod'
      - name: build tat ca binary Go
        if: needs.changes.outputs.go == 'true'
        run: |
          set -e
          for m in libs/go services/gateway services/identity services/event \
                   services/waitingroom services/ticketing services/payment \
                   services/antibot services/notification; do
            echo "== go build $m =="
            (cd "$m" && go build ./...)
          done
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: build web
        if: needs.changes.outputs.web == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v3
        if: needs.changes.outputs.python == 'true'
        with:
          enable-cache: true
      - name: build (kiem tra import) ai-worker
        if: needs.changes.outputs.python == 'true'
        working-directory: services/ai-worker
        run: |
          uv sync --all-extras
          uv run python -c "import app.main"
