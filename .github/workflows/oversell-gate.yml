name: Oversell Gate (EVF-39)

# Cong chat luong khong the bo qua: chay TestNoOversell 200 lan.
# Theo docs/04-jira-backlog.md: fail -> khong duoc merge vao main, khong duoc
# release. Chi bat buoc truoc khi vao main (nang, ~30 phut) -- PR vao develop
# va cac nhanh feature dung gate nhe hon trong integration.yml.
#
# Hai bai kiem, chay tren Postgres + Redis THAT (libs/go/testx):
#   - TestNoOversell_UnderExtremeConcurrency: 10.000 goroutine mua 100 ve, x200
#   - TestNoOversell_WithConcurrentExpiry:    sweeper song song voi viec mua, x20
#     (tach rieng: moi lan ngu >= 15 giay nen x200 la hon mot gio)
# REQUIRE_PASS=1: cong khong chay duoc lan PASS nao la DO (khong chi canh bao).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  oversell-gate:
    name: oversell-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/ticketing/go.sum
      # `go test` coi SKIP la thanh cong. Khi `setupEnv` con `t.Skip` thi gate nay xanh voi
      # 0 lan kiem that -- trong y het mot gate dang bao ve bat bien "khong ban qua so ve".
      # Script dem PASS/FAIL/SKIP, giu nguyen exit code, va canh bao khi 0 lan PASS.
      # (Skip thanh fail la quyet dinh cua truong nhom, nay bat nho REQUIRE_PASS vi test that da
      # co. Xem docs/workflow/ci-cd-review/spec.md §3 va docs/workflow/EV-134-testx-oversell-gate.)
      - name: TestNoOversell x200 (make test-oversell)
        env:
          REQUIRE_PASS: "1"
        run: bash .github/scripts/run-and-report-tests.sh TestNoOversell make test-oversell TESTFLAGS=-v
      - name: TestNoOversell hold het han x20 (make test-oversell-expiry)
        env:
          REQUIRE_PASS: "1"
        run: bash .github/scripts/run-and-report-tests.sh TestNoOversell make test-oversell-expiry TESTFLAGS=-v
