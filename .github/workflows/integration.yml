name: Integration

# Integration test dung ha tang that qua testcontainers-go (Docker socket co
# san tren runner ubuntu-latest, khong can khai bao services: rieng).
# Day la gate NHE cho moi PR; gate day du 200 lan cho EVF-39 nam o
# oversell-gate.yml va chi bat buoc truoc khi vao main.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            libs/go/go.sum
            services/ticketing/go.sum
            services/waitingroom/go.sum
            services/event/go.sum
      - name: go test -tags=integration (ticketing)
        working-directory: services/ticketing
        run: go test -tags=integration ./... -count=1 -timeout=10m
      # Bao qua run-and-report-tests.sh de mot smoke skip toan bo khong con xanh cam (xem
      # oversell-gate.yml). Duong dan tuyet doi vi step chay trong services/ticketing.
      - name: oversell smoke (20 lan, gate day du 200 lan nam o oversell-gate.yml)
        working-directory: services/ticketing
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestNoOversell \
            go test -v -tags=integration -run TestNoOversell \
            ./test/concurrency/... -count=20 -timeout=15m
      # libs/go/mq: test tich hop voi RabbitMQ that (testcontainers). Fail (khong skip) khi khong co Docker.
      - name: go vet -tags=integration (libs/go/mq)
        working-directory: libs/go
        run: go vet -tags=integration ./mq/...
      - name: go test -tags=integration (libs/go/mq)
        working-directory: libs/go
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestTichHop \
            go test -v -tags=integration ./mq/... -count=1 -timeout=10m
      # libs/go/idem: middleware Idempotency-Key tren Postgres that (BR-O5). Cung quy tac fail-khong-skip.
      - name: go vet -tags=integration (libs/go/idem)
        working-directory: libs/go
        run: go vet -tags=integration ./idem/...
      - name: go test -tags=integration (libs/go/idem)
        working-directory: libs/go
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestTichHop             go test -v -tags=integration ./idem/... -count=1 -timeout=10m
      # libs/go/leader + libs/go/loadsignal: bau leader co fencing va tin hieu suc khoe tren Redis that
      # (EV-142). Cung quy tac fail-khong-skip.
      - name: go vet -tags=integration (libs/go/leader, loadsignal)
        working-directory: libs/go
        run: go vet -tags=integration ./leader/... ./loadsignal/...
      - name: go test -tags=integration (libs/go/leader, loadsignal)
        working-directory: libs/go
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestTichHop \
            go test -v -tags=integration ./leader/... ./loadsignal/... -count=1 -timeout=10m
      # waitingroom: fencing o cac script admit, hai controller tranh leader, doi leader giua cao diem.
      - name: go vet -tags=integration (waitingroom)
        working-directory: services/waitingroom
        run: go vet -tags=integration ./...
      - name: go test -tags=integration (waitingroom)
        working-directory: services/waitingroom
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestTichHop \
            go test -v -tags=integration ./test/... -count=1 -timeout=10m
      # ai-worker (EV-157): 4 pool consumer, retry/DLQ va tat em tren RabbitMQ 3.13 + Redis 7 that.
      # pytest khong co co skip o day: thieu Docker thi fixture loi -> step do; khong thu duoc
      # test nao thi pytest tra exit 5 -> step cung do. Khong boc run-and-report-tests.sh vi
      # script do dem dong `--- PASS` cua `go test -v`.
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.30"
          enable-cache: true
          cache-dependency-glob: services/ai-worker/uv.lock
      - name: pytest -m integration (ai-worker)
        working-directory: services/ai-worker
        run: |
          uv sync --all-extras --locked
          uv run pytest -m integration -q -rA
      # event (EV-120): nop duyet ghi job kiem duyet cung transaction; relay outbox -> ai.direct ->
      # ai.moderation.q tren Postgres + RabbitMQ that. Cung quy tac fail-khong-skip.
      - name: go vet -tags=integration (event)
        working-directory: services/event
        run: go vet -tags=integration ./...
      - name: go test -tags=integration (event)
        working-directory: services/event
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestTichHop \
            go test -v -tags=integration ./internal/... -count=1 -timeout=10m
      # identity (EV-112): refresh token xoay vong, phat hien tai su dung va thu hoi tren Postgres
      # that (20 request dong thoi cung mot token -> dung 1 thang). Cung quy tac fail-khong-skip.
      - name: go vet -tags=integration (identity)
        working-directory: services/identity
        run: go vet -tags=integration ./...
      - name: go test -tags=integration (identity)
        working-directory: services/identity
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestRefreshTokenRepo \
            go test -v -tags=integration ./internal/... -count=1 -timeout=10m
