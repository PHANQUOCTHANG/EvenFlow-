name: Integration

# Integration test dung ha tang that qua testcontainers-go (Docker socket co
# san tren runner ubuntu-latest, khong can khai bao services: rieng).
# Day la gate NHE cho moi PR; gate day du 200 lan cho EVF-39 nam o
# oversell-gate.yml va chi bat buoc truoc khi vao main.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/ticketing/go.mod
      - name: go test -tags=integration (ticketing)
        working-directory: services/ticketing
        run: go test -tags=integration ./... -count=1 -timeout=10m
      - name: oversell smoke (20 lan, gate day du 200 lan nam o oversell-gate.yml)
        working-directory: services/ticketing
        run: |
          go test -tags=integration -run TestNoOversell \
            ./test/concurrency/... -count=20 -timeout=15m
