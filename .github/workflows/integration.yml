name: Integration

# Integration test dung ha tang that qua testcontainers-go (Docker socket co
# san tren runner ubuntu-latest, khong can khai bao services: rieng).
# Day la gate NHE cho moi PR; gate day du 200 lan cho EVF-39 nam o
# oversell-gate.yml va chi bat buoc truoc khi vao main.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            libs/go/go.sum
            services/ticketing/go.sum
      - name: go test -tags=integration (ticketing)
        working-directory: services/ticketing
        run: go test -tags=integration ./... -count=1 -timeout=10m
      # Bao qua run-and-report-tests.sh de mot smoke skip toan bo khong con xanh cam (xem
      # oversell-gate.yml). Duong dan tuyet doi vi step chay trong services/ticketing.
      - name: oversell smoke (20 lan, gate day du 200 lan nam o oversell-gate.yml)
        working-directory: services/ticketing
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestNoOversell \
            go test -v -tags=integration -run TestNoOversell \
            ./test/concurrency/... -count=20 -timeout=15m
      # libs/go/mq: test tich hop voi RabbitMQ that (testcontainers). Fail (khong skip) khi khong co Docker.
      - name: go vet -tags=integration (libs/go/mq)
        working-directory: libs/go
        run: go vet -tags=integration ./mq/...
      - name: go test -tags=integration (libs/go/mq)
        working-directory: libs/go
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestTichHop \
            go test -v -tags=integration ./mq/... -count=1 -timeout=10m
      # libs/go/idem: middleware Idempotency-Key tren Postgres that (BR-O5). Cung quy tac fail-khong-skip.
      - name: go vet -tags=integration (libs/go/idem)
        working-directory: libs/go
        run: go vet -tags=integration ./idem/...
      - name: go test -tags=integration (libs/go/idem)
        working-directory: libs/go
        env:
          REQUIRE_PASS: "1"
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-and-report-tests.sh" TestTichHop             go test -v -tags=integration ./idem/... -count=1 -timeout=10m
