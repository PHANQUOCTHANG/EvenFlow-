name: Trivy scan

# EVF-6: Trivy phat hien lo hong CRITICAL thi chan merge.
# Chi build + scan image nao thuc su co Dockerfile hien nay.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

# Quyen toi thieu; `pull-requests: read` cho dorny/paths-filter tren pull_request.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Filter phai gom MOI thu ma `docker build` doc, khong chi thu muc cua service
            # duoc quet. Image Go copy `go.work` + go.mod cua CA 9 module, nen sua go.mod cua
            # gateway (vd nang `go` directive) lam hong image ticketing -- truoc day thay doi
            # do khong kich hoat quet nao, va day la noi DUY NHAT build image Go tren PR.
            any:
              - 'deploy/docker/**'
              - 'services/**'
              - 'apps/web/**'
              - 'libs/go/**'
              - 'go.work'
              - '.dockerignore'
              # Sua chinh workflow nay thi phai quet lai, neu khong mot thay doi lam hong
              # buoc quet se merge ma khong lan nao chay.
              - '.github/workflows/trivy.yml'

  scan:
    name: trivy
    needs: changes
    if: needs.changes.outputs.any == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: waitingroom
            dockerfile: deploy/docker/waitingroom.Dockerfile
          - name: ticketing
            dockerfile: deploy/docker/ticketing.Dockerfile
          - name: ai-worker
            dockerfile: deploy/docker/ai-worker.Dockerfile
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: build image ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t eventflow/${{ matrix.name }}:ci .
      - name: trivy scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eventflow/${{ matrix.name }}:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

  trivy-gate:
    name: trivy-gate
    needs: [changes, scan]
    # `always()`, KHONG dat dieu kien vao day. GitHub tinh job bi SKIP la "Success", ke ca
    # khi no la required check. Ban cu `!contains(needs.scan.result, 'failure')` o `if:` nen
    # khi scan tim ra CRITICAL thi gate bi skip va bao XANH -- dung cai gate sinh ra de chan.
    # No cung chi xet `scan`, nen `detect-changes` hong => scan skip => gate xanh.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `if: always()` ca o STEP: khong co no thi step mang dieu kien ngam `success()` va co
      # the bi skip khi run bi huy -- gate khong fail duoc.
      - name: chan neu scan hoac detect-changes fail / bi huy
        if: always()
        env:
          GATE_BAD: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ "$GATE_BAD" = "true" ]; then
            echo "::error title=trivy-gate::co job truoc fail hoac bi huy (CRITICAL, hoac detect-changes hong) -- KHONG DAT."
            printf '%s\n' "$NEEDS_JSON"
            exit 1
          fi
          echo "khong co CRITICAL moi hoac khong co gi lien quan Docker de scan"
