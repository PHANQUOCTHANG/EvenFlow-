name: E2E web

# EV-198 (EVF-128): luong mua ve day du bang Playwright tren ban build production cua web,
# backend GIA LAP bang page.route (tests/e2e/fixtures/api-mock.ts). Khong can Docker nen chay
# duoc cho moi PR. Luong tren compose that van nam o e2e-nightly.yml va chua dat: compose chua
# co gateway, payment, order (docs/workflow/EV-198-e2e-playwright/spec.md muc 1).

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/e2e/**'
      - 'package-lock.json'
      - '.github/workflows/e2e-web.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'tests/e2e/**'
      - 'package-lock.json'
      - '.github/workflows/e2e-web.yml'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'So lan lap moi test (AC-8: chay 20 de chung minh khong flaky)'
        required: false
        default: '1'

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Phai trung voi E2E_API_BASE: Next inline NEXT_PUBLIC_* luc build, fixture chi gia lap dung
  # origin nay va coi request toi origin khac la vi pham.
  API_BASE: "http://localhost:8080"

jobs:
  e2e-web:
    name: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Cho nghiep vu bang sleep co dinh, hoac de lai .skip/.only/.todo, la hai cach pho bien
      # nhat lam E2E flaky hoac xanh gia. Chan ngay o day, truoc khi ton phut build.
      - name: chan waitForTimeout / .skip / .only / .todo trong tests/e2e
        run: |
          # Chi khop LOI GOI (co dau "("), khong khop chu trong comment. Bat ca dang long nhau
          # (test.describe.serial.skip() va dang co khoang trang (`test .only (`). Ngu bang
          # setTimeout boc trong Promise cung la sleep co dinh nen cung bi chan.
          if grep -rnE '\.[[:space:]]*waitForTimeout[[:space:]]*\(|\b(test|it|describe)([[:space:]]*\.[[:space:]]*(describe|serial|parallel))*[[:space:]]*\.[[:space:]]*(skip|only|todo|fixme)[[:space:]]*\(|new Promise[^;]*setTimeout' \
              tests/e2e --include='*.ts' --include='*.js' --include='*.mjs' --exclude-dir=node_modules; then
            echo "::error title=e2e-hygiene::tests/e2e co waitForTimeout hoac test bi skip/only/todo"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            tests/e2e/package-lock.json

      - name: build web (production)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: ${{ env.API_BASE }}
        run: |
          npm ci
          npm run build
          # output: "standalone" -> chay server.js giong web.Dockerfile, khong dung `next start`.
          # Repo co package-lock.json o goc nen Next lay goc repo lam tracing root va dat server.js
          # o .next/standalone/apps/web/ (trong Docker chi copy apps/web nen no nam ngay goc).
          # Tim server.js thay vi doan duong dan; lay ban NONG nhat (khong phu thuoc thu tu cua find).
          server_js=$(find .next/standalone -name server.js -not -path '*/node_modules/*' \
            | awk -F/ '{ print NF "\t" $0 }' | sort -n | head -n 1 | cut -f2-)
          if [ -z "$server_js" ]; then echo "::error title=e2e-web::khong thay server.js standalone"; exit 1; fi
          server_dir=$(dirname "$server_js")
          cp -r .next/static "$server_dir/.next/static"
          cp -r public "$server_dir/public"
          echo "WEB_SERVER_DIR=$GITHUB_WORKSPACE/apps/web/$server_dir" >> "$GITHUB_ENV"

      - name: chay web
        working-directory: ${{ env.WEB_SERVER_DIR }}
        env:
          HOSTNAME: 127.0.0.1
          PORT: "3000"
        run: |
          nohup node server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/healthz >/dev/null && exit 0
            sleep 2
          done
          echo "::error title=e2e-web::web khong san sang sau 60s"
          cat "$RUNNER_TEMP/web.log"
          exit 1

      - name: cai playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: playwright
        working-directory: tests/e2e
        env:
          BASE_URL: http://localhost:3000
          E2E_API_BASE: ${{ env.API_BASE }}
          REPEAT_EACH: ${{ github.event.inputs.repeat_each || '1' }}
        run: npx playwright test --repeat-each="$REPEAT_EACH"

      - name: log web khi fail
        if: failure()
        run: cat "$RUNNER_TEMP/web.log" || true

      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-report
          path: |
            tests/e2e/report
            tests/e2e/test-results
          retention-days: 7
