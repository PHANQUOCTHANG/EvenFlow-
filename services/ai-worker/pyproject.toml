[project]
name = "eventflow-ai-worker"
version = "0.1.0"
description = "Consumer Gemini cho EventFlow: tro ly phong cho, kiem duyet, phat hien bat thuong, bao cao"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "aio-pika>=9.4",
    "google-genai>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # Import truc tiep (tools.py, consumers/moderation.py): khong dua vao phu thuoc bac cau.
    "httpx>=0.28",
]

[project.optional-dependencies]
# ruff pin CUNG mot ban: khong co uv.lock, nen `ruff>=0.7` cho CI cai ban moi nhat moi lan
# chay -- ban moi them luat va CI do ma khong ai doi dong code nao. Nang ban la viec co chu y.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff==0.16.10", "testcontainers>=4.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Test tich hop can Docker: mac dinh bo qua, chay rieng bang `pytest -m integration`
# (CI: .github/workflows/integration.yml). `-m` tren dong lenh de len gia tri nay.
addopts = "-m 'not integration'"
markers = ["integration: can RabbitMQ + Redis that (testcontainers)"]
