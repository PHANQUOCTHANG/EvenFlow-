groups:
  - name: eventflow-critical
    rules:
      # Bat bien so 1 cua he thong. Bat ky lan tu choi nao cung co nghia la
      # tang tren da de lot mot request le ra phai bi chan som hon.
      - alert: OversellGuardTriggered
        expr: increase(ticketing_oversell_guard_rejections_total[1m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Chot chan oversell o Postgres da phai ra tay"
          runbook: "docs/runbook.md#oversell"

      # Hang cho con nguoi ma khong ai duoc tha vao -> hoac controller chet,
      # hoac leader lock bi ket. Khach dang ngoi cho vo ich.
      - alert: AdmitRateStalled
        expr: waitingroom_admit_rate == 0 and waitingroom_queue_depth > 0
        for: 60s
        labels: { severity: critical }

      # Hai controller cung tu nhan la leader cua mot su kien keo dai. Fencing van chan duoc lenh
      # ghi cua leader cu, nhung chi co the xay ra khi Redis failover hoac lease bi sai cau hinh
      # (EV-142): trong luc do toc do tha nguoi co the gap doi.
      - alert: AdmitLeaderSplit
        expr: sum by (event) (waitingroom_admit_leader) > 1
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "Su kien {{ $labels.event }} co hon mot admit controller dang la leader"

      # Co controller song nhung khong ai giu quyen admit: hang cho khong duoc tha.
      - alert: AdmitNoLeader
        expr: max by (event) (waitingroom_admit_leader) == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Su kien {{ $labels.event }} khong co admit controller nao la leader"

      # Redis va Postgres lech nhau -> ve bi khoa hoac bao het som.
      - alert: InventoryDrift
        expr: abs(ticketing_inventory_drift) > 0
        for: 30s
        labels: { severity: warning }

      # Limiter dang lam dung viec thi con so nay phai bang 0. Khac 0 nghia la
      # co duong goi Gemini nao do di vong qua limiter.
      - alert: GeminiRateLimited
        expr: increase(ai_gemini_429_total[5m]) > 0
        for: 0m
        labels: { severity: warning }

      # EV-159: message trong ai.dlq la job da bi bo -- su kien co the dang ket o PENDING_REVIEW,
      # hoac co mot loai loi vinh vien moi. Phai co nguoi xem va replay.
      - alert: AiDeadLetterQueueNotEmpty
        expr: ai_dlq_depth > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "ai.dlq dang co {{ $value }} message chua ai xu ly"

      # Hang loat job vao DLQ: Gemini/event service hong dien rong hoac mot ban deploy loi.
      - alert: AiDeadLetterSpike
        expr: sum(rate(ai_dead_lettered_total[5m])) * 60 > 10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Hon 10 job AI/phut dang vao DLQ"

      - alert: AiQueueLag
        expr: ai_queue_lag_seconds{queue="ai.chat.q"} > 30
        for: 2m
        labels: { severity: warning }

      - alert: SemanticCacheDegraded
        expr: ai_semantic_cache_hit_ratio < 0.7
        for: 5m
        labels: { severity: warning }
