global:
  scrape_interval: 5s      # ngan vi admit controller phan ung theo giay
  evaluation_interval: 5s

scrape_configs:
  - job_name: waitingroom
    static_configs: [{ targets: ["waitingroom:8081"] }]
  - job_name: ticketing
    static_configs: [{ targets: ["ticketing:8082"] }]
  # Hai process khong co HTTP API nen mo cong metrics rieng.
  - job_name: waitingroom-controller
    static_configs: [{ targets: ["waitingroom-controller:9091"] }]
  - job_name: ticketing-worker
    static_configs: [{ targets: ["ticketing-worker:9092"] }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:9094"] }]
  - job_name: identity
    static_configs: [{ targets: ["identity:8083"] }]
  - job_name: event
    static_configs: [{ targets: ["event:8084"] }]
  - job_name: payment
    static_configs: [{ targets: ["payment:8085"] }]
  - job_name: notification
    static_configs: [{ targets: ["notification:8087"] }]
  - job_name: ai-worker
    static_configs: [{ targets: ["ai-worker:8090"] }]

rule_files:
  - /etc/prometheus/alerts.yml
