# Deployment for ai-worker (k8s-all spec 4.1): Python worker: chat, moderation; HTTP API on 8090.
#
# Values come from spec 4.1 and policy-contract.md; env = the compose block with hostnames
# replaced by Service names or by keys of `eventflow-endpoints` / `eventflow-app-config` (per overlay),
# and every secret from `secretKeyRef` per policy-contract.md section 8 (never optional,
# never `envFrom`). Overlay-only secret keys are added by the overlay, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-ai-worker
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-ai-worker
    app.kubernetes.io/part-of: eventflow
spec:
  # No `replicas`: the HPA owns the count (AC-7); `kubectl apply` must not reset it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # AC-6: never drop below the current Ready count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-ai-worker
      app.kubernetes.io/part-of: eventflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow-ai-worker
        app.kubernetes.io/part-of: eventflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
    spec:
      # AC-6: >= 5 s preStop + 20 s (shutdown_grace_seconds, spec E4) app grace + 5 s margin.
      terminationGracePeriodSeconds: 35
      # AC-12: no process calls the Kubernetes API.
      automountServiceAccountToken: false
      # AC-11: soft rules only, so a one-node local cluster still schedules every replica.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: eventflow-ai-worker
                    app.kubernetes.io/part-of: eventflow
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eventflow-ai-worker
              app.kubernetes.io/part-of: eventflow
      securityContext:
        # AC-12: the image sets a numeric USER (AC-13); no runAsUser here on purpose, so a
        # Dockerfile regression fails loudly (CreateContainerConfigError) instead of being masked.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-worker
          # AC-20: no tag in base; the overlay `images:` list sets sha-<short>.
          image: ghcr.io/phanquocthang/eventflow-ai-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: eventflow-endpoints
                  key: REDIS_URL
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: eventflow-mq
                  key: AMQP_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eventflow-ai
                  key: GEMINI_API_KEY
            - name: GEMINI_MOCK
              valueFrom:
                configMapKeyRef:
                  name: eventflow-app-config
                  key: GEMINI_MOCK
            - name: GEMINI_RPM
              value: "55"
            - name: GEMINI_TPM
              value: "900000"
            - name: CHAT_CONSUMERS
              value: "20"
            - name: MODERATION_CONSUMERS
              value: "5"
            - name: ANOMALY_CONSUMERS
              value: "1"
            - name: REPORT_CONSUMERS
              value: "1"
            - name: INTERNAL_API_BASE
              value: "http://eventflow-gateway:8080"
            - name: MODERATION_API_BASE
              value: "http://eventflow-event:8084"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # AC-5: liveness never touches dependencies; readiness may (503 on failure).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Core `sleep` handler (k8s >= 1.30, spec E5): distroless/python images have no
              # sleep binary. Gives endpoints time to drop the pod before SIGTERM.
              sleep:
                seconds: 5
          volumeMounts:
            # AC-12: root fs is read-only; Python needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
