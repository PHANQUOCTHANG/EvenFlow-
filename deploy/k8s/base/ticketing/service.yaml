# Service for ticketing: ClusterIP only; reachable from gateway per NetworkPolicy (spec 6.2).
# Selector = the Deployment pod labels exactly; targetPort by container port name (AC-22).
apiVersion: v1
kind: Service
metadata:
  name: eventflow-ticketing
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-ticketing
    app.kubernetes.io/part-of: eventflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventflow-ticketing
    app.kubernetes.io/part-of: eventflow
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
