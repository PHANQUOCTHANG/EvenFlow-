# PDB for payment (AC-10): maxUnavailable 1, selector = pod labels exactly.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eventflow-payment
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-payment
    app.kubernetes.io/part-of: eventflow
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-payment
      app.kubernetes.io/part-of: eventflow
