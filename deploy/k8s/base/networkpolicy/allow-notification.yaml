# Spec k8s-all 6.2 / AC-15. Ingress only; egress is not restricted in this task.
# notification: background process; only monitoring on its health/metrics port.
# Monitoring = namespaces labelled eventflow.io/monitoring="true" (none exists yet).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification
  labels:
    app.kubernetes.io/part-of: eventflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eventflow-notification
      app.kubernetes.io/part-of: eventflow
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              eventflow.io/monitoring: "true"
      ports:
        - protocol: TCP
          port: 8087
