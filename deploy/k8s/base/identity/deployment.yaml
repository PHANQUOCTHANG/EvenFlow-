# Deployment for identity (k8s-all spec 4.1): accounts, login, JWT issue; connects to Postgres directly (lib/pq, spec F11).
#
# Values come from spec 4.1 and policy-contract.md; env = the compose block with hostnames
# replaced by Service names or by keys of `eventflow-endpoints` / `eventflow-app-config` (per overlay),
# and every secret from `secretKeyRef` per policy-contract.md section 8 (never optional,
# never `envFrom`). Overlay-only secret keys are added by the overlay, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-identity
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-identity
    app.kubernetes.io/part-of: eventflow
spec:
  # No `replicas`: the HPA owns the count (AC-7); `kubectl apply` must not reset it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # AC-6: never drop below the current Ready count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-identity
      app.kubernetes.io/part-of: eventflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow-identity
        app.kubernetes.io/part-of: eventflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /metrics
    spec:
      # AC-6: >= 5 s preStop + none (no SIGTERM handling, spec F7; 30 s default rule) app grace + 5 s margin.
      terminationGracePeriodSeconds: 30
      # AC-12: no process calls the Kubernetes API.
      automountServiceAccountToken: false
      # AC-11: soft rules only, so a one-node local cluster still schedules every replica.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: eventflow-identity
                    app.kubernetes.io/part-of: eventflow
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eventflow-identity
              app.kubernetes.io/part-of: eventflow
      securityContext:
        # AC-12: the image sets a numeric USER (AC-13); no runAsUser here on purpose, so a
        # Dockerfile regression fails loudly (CreateContainerConfigError) instead of being masked.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          # AC-20: no tag in base; the overlay `images:` list sets sha-<short>.
          image: ghcr.io/phanquocthang/eventflow-identity
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: eventflow-app-config
                  key: APP_ENV
            - name: HTTP_ADDR
              value: ":8083"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: eventflow-endpoints
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eventflow-db
                  key: DATABASE_URL_DIRECT
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: eventflow-endpoints
                  key: REDIS_ADDR
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventflow-auth
                  key: JWT_SECRET
            - name: PII_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: eventflow-identity
                  key: PII_ENC_KEY
            - name: PII_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: eventflow-identity
                  key: PII_HASH_KEY
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: eventflow-endpoints
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: eventflow-endpoints
                  key: SMTP_PORT
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: eventflow-app-config
                  key: GOOGLE_CLIENT_ID
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          # Spec F5/9 debt: no /readyz yet, so readiness = liveness.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Core `sleep` handler (k8s >= 1.30, spec E5): distroless/python images have no
              # sleep binary. Gives endpoints time to drop the pod before SIGTERM.
              sleep:
                seconds: 5
