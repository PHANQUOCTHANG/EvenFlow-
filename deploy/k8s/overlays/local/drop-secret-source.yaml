# Removes the temporary all-keys Secret after `replacements` copied its keys (see kustomization.yaml).
# A `patches:` entry would run BEFORE replacements, so this must be a `transformers:` entry.
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: drop-eventflow-dev-secrets-source
patch: |-
  $patch: delete
  apiVersion: v1
  kind: Secret
  metadata:
    name: eventflow-dev-secrets-source
