# Postgres cho overlay local (dev-infra, 1 replica). Staging/prod dung DB ngoai.
#
# Chay bang uid/gid cua chinh image (r2-m2): postgres:16-alpine co
# `postgres:x:70:70` trong /etc/passwd, /var/lib/postgresql/data owner 70:70 (doc tu
# image config + layer, 2026-11-01). Entrypoint chinh thuc bo qua chown/su-exec khi
# khong phai uid 0, nen drop ALL van chay duoc, khong can exemption capability.
#
# PVC: fsGroup 70 + fsGroupChangePolicy OnRootMismatch (r3-m4). Neu StorageClass
# (vd. hostpath cua Docker Desktop) khong ap fsGroup va thu muc khong ghi duoc,
# them component `ephemeral-data` vao overlay (emptyDir, chap nhan mat du lieu dev)
# thay vi them exemption.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eventflow-postgres
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-postgres
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  annotations:
    eventflow.io/policy-exempt.AC-6: "dev database, single replica StatefulSet"
    eventflow.io/policy-exempt.AC-10: "single replica dev database, no PDB"
    eventflow.io/policy-exempt.AC-11: "single replica, nothing to spread"
    eventflow.io/policy-exempt.AC-20: "upstream image postgres, version pinned (AC-21)"
spec:
  replicas: 1
  serviceName: eventflow-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-postgres
      app.kubernetes.io/part-of: eventflow
      eventflow.io/tier: dev-infra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow-postgres
        app.kubernetes.io/part-of: eventflow
        eventflow.io/tier: dev-infra
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # Giong compose, tru shared_buffers 512MB -> 128MB cho limit 768Mi (m9).
          args:
            - postgres
            - -c
            - max_connections=200
            - -c
            - shared_buffers=128MB
            - -c
            - synchronous_commit=on
            - -c
            - log_min_duration_statement=200ms
          env:
            - name: POSTGRES_USER
              value: eventflow
            - name: POSTGRES_DB
              value: eventflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventflow-dev-infra
                  key: POSTGRES_PASSWORD
            # Thu muc con: goc cua volume co the chua lost+found, initdb tu choi.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          # Kiem qua TCP (-h 127.0.0.1): luc initdb lan dau entrypoint chay server tam chi
          # nghe unix socket, kiem qua socket se bao san sang qua som (giong compose).
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "eventflow", "-d", "eventflow"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "eventflow", "-d", "eventflow"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "eventflow", "-d", "eventflow"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: eventflow-postgres
          app.kubernetes.io/part-of: eventflow
          eventflow.io/tier: dev-infra
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eventflow-postgres
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-postgres
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventflow-postgres
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  ports:
    - name: pg
      port: 5432
      targetPort: pg
