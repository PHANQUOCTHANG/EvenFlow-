# Mailpit: SMTP gia cho overlay local (bat email OTP/ve, xem tren UI 8025).
#
# Image axllent/mailpit:v1.21 khong dat USER va /etc/passwd khong co user rieng; binary
# Go tinh khong can tra user, cong > 1024, nen chay bang uid/gid 1000 khong can capability
# nao (r2-m2). DB tam cua Mailpit nam o /tmp -> emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-mailpit
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-mailpit
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  annotations:
    eventflow.io/policy-exempt.AC-6: "dev mail catcher, single replica"
    eventflow.io/policy-exempt.AC-10: "single replica dev tool, no PDB"
    eventflow.io/policy-exempt.AC-11: "single replica, nothing to spread"
    eventflow.io/policy-exempt.AC-20: "upstream image axllent/mailpit, version pinned (AC-21)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-mailpit
      app.kubernetes.io/part-of: eventflow
      eventflow.io/tier: dev-infra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow-mailpit
        app.kubernetes.io/part-of: eventflow
        eventflow.io/tier: dev-infra
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          startupProbe:
            tcpSocket:
              port: smtp
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: smtp
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: smtp
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eventflow-mailpit
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-mailpit
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventflow-mailpit
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
