# Redis cho overlay local. Co giong compose, tru maxmemory 2gb -> 256mb (limit 512Mi, m9).
#
# Chay bang uid/gid cua image (r2-m2): redis:7-alpine co `redis:x:999:1000`
# (uid 999, gid 1000), /data owner 999:1000. Entrypoint chi chown/su-exec khi la uid 0.
# /data la emptyDir: hang cho chiu duoc mat du lieu (Postgres la nguon su that), AOF
# van bat de giong compose trong vong doi pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-redis
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-redis
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  annotations:
    eventflow.io/policy-exempt.AC-6: "dev cache, single replica"
    eventflow.io/policy-exempt.AC-10: "single replica dev tool, no PDB"
    eventflow.io/policy-exempt.AC-11: "single replica, nothing to spread"
    eventflow.io/policy-exempt.AC-20: "upstream image redis, version pinned (AC-21)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-redis
      app.kubernetes.io/part-of: eventflow
      eventflow.io/tier: dev-infra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow-redis
        app.kubernetes.io/part-of: eventflow
        eventflow.io/tier: dev-infra
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eventflow-redis
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-redis
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventflow-redis
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  ports:
    - name: redis
      port: 6379
      targetPort: redis
