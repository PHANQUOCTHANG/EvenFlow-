# RabbitMQ cho overlay local. StatefulSet de hostname on dinh (eventflow-rabbitmq-0):
# ten node rabbit@<hostname> quyet dinh thu muc mnesia, doi hostname la mat du lieu (m9).
#
# Chay bang uid/gid cua image (r2-m2): rabbitmq:3.13-management-alpine co
# `rabbitmq:x:100:101` (uid 100, gid 101); /var/lib/rabbitmq, /etc/rabbitmq owner
# 100:101. Entrypoint chi chown/su-exec khi la uid 0.
#
# fsGroupChangePolicy OnRootMismatch (r3-m4): voi Always, kubelet them quyen group rw
# moi lan mount, .erlang.cookie bi group-readable va RabbitMQ tu choi khoi dong lan 2.
# Neu PVC khong ghi duoc (hostpath khong ap fsGroup), dung component `ephemeral-data`.
#
# Topology (exchange/queue) do code khai bao (libs/go/mq), khong nap definitions.json.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eventflow-rabbitmq
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-rabbitmq
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  annotations:
    eventflow.io/policy-exempt.AC-6: "dev broker, single replica StatefulSet"
    eventflow.io/policy-exempt.AC-10: "single replica dev broker, no PDB"
    eventflow.io/policy-exempt.AC-11: "single replica, nothing to spread"
    eventflow.io/policy-exempt.AC-20: "upstream image rabbitmq, version pinned (AC-21)"
spec:
  replicas: 1
  serviceName: eventflow-rabbitmq
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-rabbitmq
      app.kubernetes.io/part-of: eventflow
      eventflow.io/tier: dev-infra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow-rabbitmq
        app.kubernetes.io/part-of: eventflow
        eventflow.io/tier: dev-infra
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: eventflow
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: eventflow-dev-infra
                  key: RABBITMQ_DEFAULT_PASS
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # `ping` chi bao node Erlang song, luc do cong AMQP chua mo; check_port_connectivity
          # kiem listener da nhan ket noi (giong compose). Moi lan goi khoi dong mot VM
          # Erlang (vai giay) -> timeout 15 s. Khoi dong lanh co the > 100 s: startup
          # 5 s x 36 (m9).
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: eventflow-rabbitmq
          app.kubernetes.io/part-of: eventflow
          eventflow.io/tier: dev-infra
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eventflow-rabbitmq
  namespace: eventflow
  labels:
    app.kubernetes.io/name: eventflow-rabbitmq
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventflow-rabbitmq
    app.kubernetes.io/part-of: eventflow
    eventflow.io/tier: dev-infra
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
