name: eventflow

# Moi truong phat trien cuc bo: du ca ha tang de chay tron mot dot mo ban thu.
# Gemini co the chay o che do mock (GEMINI_MOCK=1) de khong ton quota khi dev.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
      POSTGRES_DB: eventflow
    # Cau hinh nghieng ve thong luong ghi, giong production hon mac dinh.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c synchronous_commit=on
      -c log_min_duration_statement=200ms
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: eventflow
      DB_PASSWORD: eventflow
      DB_NAME: eventflow
      # Transaction pooling: 2000 ket noi tu app -> 100 ket noi that toi Postgres.
      # Khong co lop nay, dinh tai se lam can sach connection slot.
      POOL_MODE: transaction
      # Postgres 16 mac dinh SCRAM. Voi AUTH_TYPE mac dinh (md5) entrypoint ghi hash md5
      # vao userlist, PgBouncer khong dung duoc de lam SCRAM toi server va moi ket noi
      # that bai voi "cannot do SCRAM authentication: wrong password type".
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "100"
    ports: ["6432:5432"]
    depends_on:
      postgres: {condition: service_healthy}

  redis:
    image: redis:7-alpine
    # appendonly bat de mo phong production; hang cho van chiu duoc mat du lieu
    # (Postgres la nguon su that), nhung bat de test duoc kich ban failover.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy noeviction
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: eventflow
      RABBITMQ_DEFAULT_PASS: eventflow
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - "rabbitdata:/var/lib/rabbitmq"
      - "../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eventflow
      MINIO_ROOT_PASSWORD: eventflow123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:latest
    # alerts.yml duoc rule_files tham chieu trong prometheus.yml; thieu mount nay thi
    # Prometheus khong nap duoc luat va alert im lang.
    volumes:
      - "../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "../observability/alerts.yml:/etc/prometheus/alerts.yml:ro"
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: eventflow
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3001:3000"]
    volumes: ["grafanadata:/var/lib/grafana"]

  # ---------------------------- SERVICE ----------------------------

  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.22.0
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres user=eventflow password=eventflow dbname=eventflow sslmode=disable"
    volumes: ["../../migrations:/migrations"]
    depends_on:
      postgres: {condition: service_healthy}

  waitingroom:
    build:
      context: ../..
      dockerfile: deploy/docker/waitingroom.Dockerfile
    environment:
      HTTP_ADDR: ":8081"
      REDIS_ADDR: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    ports: ["8081:8081"]
    depends_on:
      redis: {condition: service_healthy}

  waitingroom-controller:
    build:
      context: ../..
      dockerfile: deploy/docker/waitingroom.Dockerfile
    # Cung image voi waitingroom, doi entrypoint sang binary controller.
    # CHI MOT instance: chua co bau leader (TODO EVF-55).
    entrypoint: ["/controller"]
    environment:
      REDIS_ADDR: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
      ACTIVE_EVENT_IDS: "${ACTIVE_EVENT_IDS:-11111111-1111-4111-8111-111111111111,22222222-2222-4222-8222-222222222222}"
      # Tran thap cho local: HealthProbe hien la ban tinh nen rate se leo toi tran.
      ADMIT_MIN_RATE: "${ADMIT_MIN_RATE:-5}"
      ADMIT_MAX_RATE: "${ADMIT_MAX_RATE:-50}"
      ADMIT_STEP_UP: "${ADMIT_STEP_UP:-10}"
      ADMIT_BACKOFF: "${ADMIT_BACKOFF:-0.7}"
      ADMIT_TTL_SECONDS: "${ADMIT_TTL_SECONDS:-900}"
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  ticketing:
    build:
      context: ../..
      dockerfile: deploy/docker/ticketing.Dockerfile
    environment:
      HTTP_ADDR: ":8082"
      REDIS_ADDR: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
      # Qua PgBouncer, khong noi thang Postgres -- giong production.
      DATABASE_URL: "postgres://eventflow:eventflow@pgbouncer:5432/eventflow?sslmode=disable"
      AMQP_URL: "amqp://eventflow:eventflow@rabbitmq:5672/"
    ports: ["8082:8082"]
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}


  ticketing-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/ticketing.Dockerfile
    # Cung image voi ticketing, doi entrypoint sang binary worker: sweeper tra kho
    # hold het han va seeder nap ton kho Postgres -> Redis.
    entrypoint: ["/worker"]
    environment:
      REDIS_ADDR: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
      DATABASE_URL: "postgres://eventflow:eventflow@pgbouncer:5432/eventflow?sslmode=disable"
      ACTIVE_EVENT_IDS: "${ACTIVE_EVENT_IDS:-11111111-1111-4111-8111-111111111111,22222222-2222-4222-8222-222222222222}"
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  ai-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/ai-worker.Dockerfile
    environment:
      REDIS_URL: "redis://redis:6379/0"
      AMQP_URL: "amqp://eventflow:eventflow@rabbitmq:5672/"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MOCK: "${GEMINI_MOCK:-1}"
      # Dat thap hon han muc that de chua bien an toan (xem limiter.py).
      GEMINI_RPM: "55"
      GEMINI_TPM: "900000"
    ports: ["8090:8090"]
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      # Next INLINE moi bien NEXT_PUBLIC_* vao bundle luc BUILD. Dat no o
      # `environment:` (runtime) hoan toan vo tac dung: bundle da duoc build xong
      # truoc do voi API_BASE = "". Khi ay browser goi URL tuong doi tren chinh
      # origin cua pod web -- noi chi co /api/healthz va /api/readyz -- nen moi
      # call queue/ticketing tra 404, trong khi compose TRONG NHU da cau hinh dung
      # va nguoi doc se di tim loi o backend.
      args:
        NEXT_PUBLIC_API_BASE: "http://localhost:8080"
    ports: ["3000:3000"]
    # Goi /api/healthz (liveness) chu khong phai /api/readyz: compose coi
    # unhealthy la trang thai cua container, con readyz la trang thai "co nen
    # nhan traffic khong" -- do la viec cua k8s readinessProbe.
    #
    # Dung `node` chu khong `curl` (khong co trong node:22-alpine) va khong
    # `wget` (co nhung la chi tiet cua base image, mat khi doi base).
    #
    # DIEU KIEN de lenh nay chay duoc: Next standalone bind theo
    # process.env.HOSTNAME (`const hostname = process.env.HOSTNAME || '0.0.0.0'`
    # trong server.js do output: "standalone" sinh ra). Docker dat HOSTNAME =
    # container id => Next bind vao IP eth0, KHONG bind loopback => fetch toi
    # 127.0.0.1 nhan ECONNREFUSED va service web unhealthy vinh vien. Vi vay
    # web.Dockerfile phai co ENV HOSTNAME=0.0.0.0 va ENV PORT=3000 (C3, chu la
    # Integrator).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
  grafanadata:
